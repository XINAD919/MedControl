<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <clipPath id="iconClip">
      <rect width="512" height="512" rx="100"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>

  <g clip-path="url(#iconClip)">

    <!-- ══ CHECKLIST CARD (left, partially behind robot) ══ -->
    <rect x="38" y="118" width="208" height="278" rx="22"
          fill="rgba(255,255,255,0.13)" stroke="rgba(255,255,255,0.22)" stroke-width="2"/>

    <!-- Row 1: done -->
    <circle cx="80" cy="178" r="20" fill="#10b981"/>
    <polyline points="69,178 76,186 92,169"
              fill="none" stroke="white" stroke-width="4"
              stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="112" y="170" width="108" height="16" rx="8" fill="rgba(255,255,255,0.85)"/>

    <!-- Row 2: done -->
    <circle cx="80" cy="234" r="20" fill="#10b981"/>
    <polyline points="69,234 76,242 92,225"
              fill="none" stroke="white" stroke-width="4"
              stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="112" y="226" width="88" height="16" rx="8" fill="rgba(255,255,255,0.85)"/>

    <!-- Row 3: pending -->
    <circle cx="80" cy="290" r="20" fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="3"/>
    <rect x="112" y="282" width="104" height="16" rx="8" fill="rgba(255,255,255,0.3)"/>

    <!-- Row 4: pending -->
    <circle cx="80" cy="346" r="20" fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="3"/>
    <rect x="112" y="338" width="78" height="16" rx="8" fill="rgba(255,255,255,0.3)"/>

    <!-- ══ ROBOT HEAD ══ -->
    <!-- Antenna stem (centered: head x=190 + width=248 / 2 = 314) -->
    <rect x="307" y="58" width="14" height="50" rx="7" fill="rgba(255,255,255,0.92)"/>
    <!-- Antenna glow -->
    <circle cx="314" cy="48" r="24" fill="#60a5fa" opacity="0.25"/>
    <!-- Antenna ball -->
    <circle cx="314" cy="48" r="16" fill="#bfdbfe" stroke="white" stroke-width="3.5"/>
    <circle cx="314" cy="48" r="6" fill="#3b82f6"/>

    <!-- Head shadow -->
    <rect x="193" y="114" width="248" height="218" rx="40" fill="rgba(0,0,0,0.1)"/>
    <!-- Head body -->
    <rect x="190" y="108" width="248" height="218" rx="40" fill="rgba(255,255,255,0.97)"/>

    <!-- Ears -->
    <rect x="168" y="162" width="22" height="52" rx="9" fill="rgba(255,255,255,0.9)"/>
    <rect x="438" y="162" width="22" height="52" rx="9" fill="rgba(255,255,255,0.9)"/>

    <!-- Left eye (center at 263, symmetric offset -51 from head center 314) -->
    <circle cx="263" cy="193" r="38" fill="#dbeafe"/>
    <circle cx="263" cy="193" r="26" fill="#3b82f6"/>
    <circle cx="263" cy="193" r="13" fill="#1e3a8a"/>
    <circle cx="255" cy="185" r="7" fill="white" opacity="0.9"/>
    <circle cx="269" cy="199" r="3" fill="white" opacity="0.5"/>

    <!-- Right eye (center at 365, symmetric offset +51 from head center 314) -->
    <circle cx="365" cy="193" r="38" fill="#dbeafe"/>
    <circle cx="365" cy="193" r="26" fill="#3b82f6"/>
    <circle cx="365" cy="193" r="13" fill="#1e3a8a"/>
    <circle cx="357" cy="185" r="7" fill="white" opacity="0.9"/>
    <circle cx="371" cy="199" r="3" fill="white" opacity="0.5"/>

    <!-- Mouth: 4 LED squares centered at x=314 (total width=126, start=251) -->
    <rect x="251" y="267" width="24" height="24" rx="5" fill="#93c5fd"/>
    <rect x="285" y="267" width="24" height="24" rx="5" fill="#60a5fa"/>
    <rect x="319" y="267" width="24" height="24" rx="5" fill="#60a5fa"/>
    <rect x="353" y="267" width="24" height="24" rx="5" fill="#93c5fd"/>

    <!-- ══ PILL (bottom-right, tilted -25°) ══ -->
    <!-- Centered at (405, 415), capsule 130x58 (rx=29). Paths exact — no overflow. -->
    <g transform="translate(405, 415) rotate(-25)">
      <!-- Shadow -->
      <ellipse cx="2" cy="8" rx="60" ry="20" fill="rgba(0,0,0,0.15)"/>
      <!-- White left half (exact capsule path: top-center → left arc → bottom-center) -->
      <path d="M 0,-29 L -36,-29 A 29,29,0,0,0,-65,0 A 29,29,0,0,0,-36,29 L 0,29 Z"
            fill="white"/>
      <!-- Emerald right half (exact capsule path) -->
      <path d="M 0,-29 L 36,-29 A 29,29,0,0,1,65,0 A 29,29,0,0,1,36,29 L 0,29 Z"
            fill="#10b981"/>
      <!-- Shine on white half -->
      <ellipse cx="-26" cy="-11" rx="20" ry="9" fill="rgba(255,255,255,0.4)"/>
      <!-- Shine on green half -->
      <ellipse cx="20" cy="-11" rx="16" ry="7" fill="rgba(255,255,255,0.22)"/>
      <!-- Outline -->
      <rect x="-65" y="-29" width="130" height="58" rx="29" fill="none"
            stroke="white" stroke-width="3.5"/>
      <!-- Center divider -->
      <line x1="0" y1="-25" x2="0" y2="25" stroke="rgba(255,255,255,0.65)" stroke-width="2"/>
    </g>

  </g>
</svg>
